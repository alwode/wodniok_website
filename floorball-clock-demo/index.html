<!DOCTYPE html>
<html lang="de">
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Interaktive Live-Demo der Floorball Clock App – Digitales Spielsekretariat & Hallenuhr (SPRGK / IFF 2026).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Floorball Clock Demo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Floorball Clock – Live Web Demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #0F1115;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
      overscroll-behavior-x: none !important;
      touch-action: none;
      -webkit-overflow-scrolling: auto;
    }
    flutter-view, flt-glass-pane {
      overscroll-behavior: none !important;
      touch-action: none !important;
    }
  </style>
</head>
<body>
  <script>
    // Prevent mouse wheel / trackpad scroll chaining from scrolling the outer parent website
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
    }, { passive: false });

    // Prevent touchmove overscroll gestures from scrolling parent container
    window.addEventListener('touchmove', function(e) {
      if (e.target && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
